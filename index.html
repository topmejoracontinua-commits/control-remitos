<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control de Remitos - Top Neumáticos</title>
    <style>
      body { 
        font-family: Arial, sans-serif; 
        padding: 0; 
        margin: 0;
        text-align: center; 
        background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1200') no-repeat center center fixed;
        background-size: cover;
      }
      
      .banner {
        background-color: #000000;
        border-bottom: 5px solid #d90429;
        padding: 15px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      .banner span {
        color: #d90429;
      }

      .card { 
        background: rgba(255, 255, 255, 0.95); 
        padding: 25px; 
        border-radius: 12px; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.4); 
        max-width: 400px; 
        margin: 40px auto 20px auto; 
        text-align: left;
        border-top: 4px solid #000000;
      }
      h2 { color: #111; margin-top: 0; font-size: 20px; text-align: center; font-weight: bold; }
      p { color: #555; font-size: 14px; text-align: center; margin-bottom: 20px; font-weight: 500; }
      label { font-weight: bold; color: #222; font-size: 14px; display: block; margin-top: 15px; }
      
      .input-container { display: flex; align-items: center; margin-top: 5px; }
      .prefix { font-weight: bold; color: #fff; background: #222; padding: 15px 10px 15px 15px; border: 1px solid #000; border-right: none; border-top-left-radius: 8px; border-bottom-left-radius: 8px; font-size: 16px; white-space: nowrap; }
      
      input[type="number"], select { width: 100%; padding: 15px; font-size: 16px; border: 1px solid #ccc; font-weight: bold; box-sizing: border-box; border-top-right-radius: 8px; border-bottom-right-radius: 8px; background-color: #fff; }
      select { border-radius: 8px; border: 1px solid #ccc; }
      
      .foto-section { background: #fff3cd; border: 1px dashed #ffc107; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
      input[type="file"] { width: 100%; margin-top: 5px; }
      
      .btn-enviar { width: 100%; padding: 15px; margin-top: 25px; font-size: 16px; font-weight: bold; border-radius: 8px; background-color: #d90429; color: white; border: none; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(217, 4, 41, 0.3); }
      .btn-enviar:active { background-color: #b00220; }
      .btn-enviar:disabled { background-color: #999; cursor: not-allowed; box-shadow: none; }
      
      #mensaje { margin-top: 18px; font-weight: bold; font-size: 15px; text-align: center; }
      .exito { color: #1b9e09; }
      .error { color: #dc3545; }
      .procesando { color: #b87a00; }
    </style>
  </head>
  <body>

    <div class="banner">
      <span>TOP</span> NEUMÁTICOS
    </div>

    <div class="card">
      <h2>📦 Control de Remitos</h2>
      <p>Gestión de estados para logística interna</p>
      
      <form id="formRemito">
        <label>1. Usuario:</label>
        <select id="usuario" name="usuario" onchange="actualizarPrefijo()" required>
          <option value="" disabled>Seleccioná tu nombre</option>
          <option value="Hermes Diego">Hermes Diego</option>
          <option value="Alexander Ayala">Alexander Ayala</option>
          <option value="Vera Matias">Vera Matias</option>
          <option value="Tagliabue Fabrizio">Tagliabue Fabrizio</option>
          <option value="Favio Rollet">Favio Rollet</option>
          <option value="Lucas Talavera">Lucas Talavera</option>
          <option value="Lubaczewski Jorge">Lubaczewski Jorge</option>
          <option value="Sanabria Julio">Sanabria Julio</option>
          <option value="Alejandro Garcia">Alejandro Garcia</option>
          <option value="Alexis Silva">Alexis Silva</option>
          <option value="Sabrina Hirt">Sabrina Hirt</option>
          <option value="Francisco Secillia">Francisco Secillia</option>
          <option value="Ramon Sand">Ramon Sand</option>
          <option value="Gustavo Schmidt">Gustavo Schmidt</option>
        </select>

        <div id="seccion_deposito_manual" style="display:none; margin-top:15px;">
          <label style="margin-top:0;">Depósito:</label>
          <select id="deposito_manual" onchange="actualizarPrefijo()">
            <option value="" selected disabled>Seleccioná depósito</option>
            <option value="DePos/OUT/">Posadas</option>
            <option value="DCtes/OUT/">Corrientes</option>
          </select>
        </div>

        <label>2. Número de Remito:</label>
        <div class="input-container">
          <span class="prefix" id="prefijoRemito">DePos/OUT/</span>
          <input type="number" id="remito_num" name="remito_num" placeholder="Ej: 06997" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required>
        </div>

        <label>3. Seleccionar Estado:</label>
        <select id="subestado_id" name="subestado_id" onchange="evaluarEstado()">
          <option value="4">🏭 Entrega depósito</option>
          <option value="3">✅ Entrega Final</option>
        </select>
        
        <div id="seccion_foto" class="foto-section">
          <label style="margin-top:0; color: #856404;">📸 Adjuntar Remito Firmado (Obligatorio):</label>
          <input type="file" id="foto_remito" name="foto" accept="image/*" capture="environment">
        </div>
        
        <button type="button" class="btn-enviar" id="btnEnviar" onclick="validarYEnviar()">🚀 ACTUALIZAR ESTADO</button>
      </form>
      
      <div id="mensaje"></div>
    </div>

    <script>
      var urlAppsScript = "https://script.google.com/macros/s/AKfycbyCeYtSs7_5F5uT73hQIvd0-u9LNQ7_-U_o5BSJEkTfX_d5MWmsv5UqeugZULkV7AtdUA/exec";

      var ID_CONFIRMACION_FINAL = "6";
      var ID_RECIBIDO_SUCURSAL = "5";

      // Usuario habilitado para ver TODAS las opciones de estado (jefe de logística)
      var USUARIO_CONFIRMACION_FINAL = "Vera Matias";

      // Usuarios de sucursal habilitados para ver/usar SOLO la opción "Recibido Sucursal"
      var usuariosRecibidoSucursal = ["Sabrina Hirt", "Francisco Secillia", "Ramon Sand", "Gustavo Schmidt"];

      // Opciones de estado según el tipo de usuario
      var OPCIONES_ESTADO = {
        default: [
          { value: "4", text: "🏭 Entrega depósito" },
          { value: "3", text: "✅ Entrega Final" }
        ],
        recibidoSucursal: [
          { value: ID_RECIBIDO_SUCURSAL, text: "🏢 Recibido Sucursal" }
        ],
        todas: [
          { value: "4", text: "🏭 Entrega depósito" },
          { value: "3", text: "✅ Entrega Final" },
          { value: ID_RECIBIDO_SUCURSAL, text: "🏢 Recibido Sucursal" },
          { value: ID_CONFIRMACION_FINAL, text: "🔒 Confirmación Final" }
        ]
      };

      // Mapeo usuario -> depósito (automático)
      var depositoPorUsuario = {
        "Hermes Diego": "DePos/OUT/",
        "Alexander Ayala": "DePos/OUT/",
        "Vera Matias": "DePos/OUT/",
        "Tagliabue Fabrizio": "DePos/OUT/",
        "Favio Rollet": "DCtes/OUT/",
        "Lubaczewski Jorge": "DePos/OUT/",
        "Sanabria Julio": "DePos/OUT/",
        "Alexis Silva": "DePos/OUT/",
        "Sabrina Hirt": "DePos/OUT/",
        "Francisco Secillia": "DePos/OUT/",
        "Ramon Sand": "DePos/OUT/",
        "Gustavo Schmidt": "DePos/OUT/"
      };

      // Usuarios que reparten en ambos depósitos: para ellos el depósito se elige a mano
      var usuariosDepositoManual = ["Lucas Talavera", "Alejandro Garcia"];

      function obtenerPrefijoActual() {
        var usuario = document.getElementById('usuario').value;
        if (usuariosDepositoManual.indexOf(usuario) !== -1) {
          return document.getElementById('deposito_manual').value;
        }
        return depositoPorUsuario[usuario] || "DePos/OUT/";
      }

      // Reconstruye el desplegable de estado según el usuario seleccionado:
      // - Vera Matias (jefe de logística): las 4 opciones
      // - usuarios de sucursal: solo "Recibido Sucursal"
      // - el resto: las dos opciones normales (Entrega depósito / Entrega Final)
      function actualizarOpcionesEstado() {
        var usuario = document.getElementById('usuario').value;
        var selectEstado = document.getElementById('subestado_id');
        var opciones;

        if (usuario === USUARIO_CONFIRMACION_FINAL) {
          opciones = OPCIONES_ESTADO.todas;
        } else if (usuariosRecibidoSucursal.indexOf(usuario) !== -1) {
          opciones = OPCIONES_ESTADO.recibidoSucursal;
        } else {
          opciones = OPCIONES_ESTADO.default;
        }

        selectEstado.innerHTML = "";
        opciones.forEach(function(op) {
          var el = document.createElement('option');
          el.value = op.value;
          el.text = op.text;
          selectEstado.appendChild(el);
        });
      }

      function actualizarPrefijo() {
        var usuario = document.getElementById('usuario').value;
        var seccionManual = document.getElementById('seccion_deposito_manual');
        if (usuariosDepositoManual.indexOf(usuario) !== -1) {
          seccionManual.style.display = "block";
        } else {
          seccionManual.style.display = "none";
        }
        document.getElementById('prefijoRemito').innerText = obtenerPrefijoActual();
        actualizarOpcionesEstado();
        evaluarEstado();
      }

      function evaluarEstado() {
        var estadoId = document.getElementById('subestado_id').value;
        // "Confirmación Final" solo actualiza el subestado en Odoo: no requiere foto
        if (estadoId === ID_CONFIRMACION_FINAL) {
          document.getElementById('seccion_foto').style.display = "none";
        } else {
          document.getElementById('seccion_foto').style.display = "block";
        }
      }

      // Convierte un File a base64 puro (sin el prefijo data:...;base64,)
      function archivoABase64(archivo) {
        return new Promise(function(resolve, reject) {
          var lector = new FileReader();
          lector.onload = function() {
            var resultado = lector.result;
            var base64 = resultado.split(',')[1];
            resolve(base64);
          };
          lector.onerror = function(error) { reject(error); };
          lector.readAsDataURL(archivo);
        });
      }

      function validarYEnviar() {
        var usuario = document.getElementById('usuario').value;
        var numInput = document.getElementById('remito_num').value.trim();
        var estadoId = document.getElementById('subestado_id').value;
        var archivoFoto = document.getElementById('foto_remito').files[0];
        var btn = document.getElementById('btnEnviar');
        var esConfirmacionFinal = (estadoId === ID_CONFIRMACION_FINAL);

        if(!usuario) {
          mostrarMensaje('⚠️ Por favor, seleccioná el usuario.', 'error');
          return;
        }

        if(usuariosDepositoManual.indexOf(usuario) !== -1 && !document.getElementById('deposito_manual').value) {
          mostrarMensaje('⚠️ Por favor, seleccioná el depósito (Posadas o Corrientes).', 'error');
          return;
        }

        if(!numInput) {
          mostrarMensaje('⚠️ Por favor, ingresá el número de remito.', 'error');
          return;
        }
        
        var prefijo = obtenerPrefijoActual();
        var numFormateado = numInput.padStart(5, '0');
        var remitoCompleto = prefijo + numFormateado;
        
        if (!esConfirmacionFinal && !archivoFoto) {
          mostrarMensaje('❌ Debes sacar o adjuntar la foto del remito firmado.', 'error');
          return;
        }

        btn.disabled = true;
        mostrarMensaje(esConfirmacionFinal ? 'Confirmando estado... ⏳' : 'Procesando y subiendo a Drive... ⏳', 'procesando');

        var enviarPayload = function(fotoBase64, fotoNombre) {
          var payload = {
            remito_id: remitoCompleto,
            subestado_id: estadoId,
            usuario: usuario,
            fotoBase64: fotoBase64 || "",
            fotoNombre: fotoNombre || ""
          };

          fetch(urlAppsScript, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          })
          .then(function() {
            btn.disabled = false;
            mostrarMensaje('¡Datos enviados! Verificá en Odoo. ✅', 'exito');

            // Guardamos el usuario para la próxima carga, y reseteamos solo remito/estado/foto
            var usuarioActual = usuario;
            document.getElementById('remito_num').value = "";
            document.getElementById('foto_remito').value = "";
            document.getElementById('usuario').value = usuarioActual;
            localStorage.setItem('ultimoUsuario', usuarioActual);
            actualizarPrefijo();
          })
          .catch(function(error) {
            btn.disabled = false;
            console.error(error);
            mostrarMensaje('❌ Error al conectar con Apps Script.', 'error');
          });
        };

        if (!esConfirmacionFinal && archivoFoto) {
          archivoABase64(archivoFoto)
            .then(function(base64) {
              enviarPayload(base64, numFormateado + ".jpg");
            })
            .catch(function() {
              btn.disabled = false;
              mostrarMensaje('❌ Error al leer el archivo.', 'error');
            });
        } else {
          enviarPayload(null, null);
        }
      }

      function mostrarMensaje(texto, clase) {
        var msgDiv = document.getElementById('mensaje');
        msgDiv.innerText = texto;
        msgDiv.className = clase;
      }

      // Al cargar la página, recuperamos el último usuario usado (si lo hay)
      window.onload = function() {
        var ultimo = localStorage.getItem('ultimoUsuario');
        if (ultimo) {
          document.getElementById('usuario').value = ultimo;
        }
        actualizarPrefijo();
      };
    </script>
  </body>
</html>
