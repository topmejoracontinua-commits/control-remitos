<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control de Remitos - Top Neumáticos</title>
    <style>
      body { 
        font-family: Arial, sans-serif; 
        padding: 0; 
        margin: 0;
        text-align: center; 
        /* Fondo con camiones de logística usando Unsplash */
        background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1200') no-repeat center center fixed;
        background-size: cover;
      }
      
      /* Banner Superior Corporativo */
      .banner {
        background-color: #000000;
        border-bottom: 5px solid #d90429; /* Rojo vibrante */
        padding: 15px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      .banner span {
        color: #d90429; /* Detalle en rojo para el "Top" */
      }

      .card { 
        background: rgba(255, 255, 255, 0.95); 
        padding: 25px; 
        border-radius: 12px; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.4); 
        max-width: 400px; 
        margin: 40px auto 20px auto; 
        text-align: left;
        border-top: 4px solid #000000;
      }
      h2 { color: #111; margin-top: 0; font-size: 20px; text-align: center; font-weight: bold; }
      p { color: #555; font-size: 14px; text-align: center; margin-bottom: 20px; font-weight: 500; }
      label { font-weight: bold; color: #222; font-size: 14px; display: block; margin-top: 15px; }
      
      .input-container { display: flex; align-items: center; margin-top: 5px; }
      .prefix { font-weight: bold; color: #fff; background: #222; padding: 15px 10px 15px 15px; border: 1px solid #000; border-right: none; border-top-left-radius: 8px; border-bottom-left-radius: 8px; font-size: 16px; }
      
      input[type="number"], select { width: 100%; padding: 15px; font-size: 16px; border: 1px solid #ccc; font-weight: bold; box-sizing: border-box; border-top-right-radius: 8px; border-bottom-right-radius: 8px; background-color: #fff; }
      select { border-radius: 8px; border: 1px solid #ccc; }
      
      .foto-section { background: #fff3cd; border: 1px dashed #ffc107; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
      input[type="file"] { width: 100%; margin-top: 5px; }
      
      /* Botón de Enviar - Rojo de Top Neumáticos */
      .btn-enviar { width: 100%; padding: 15px; margin-top: 25px; font-size: 16px; font-weight: bold; border-radius: 8px; background-color: #d90429; color: white; border: none; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(217, 4, 41, 0.3); }
      .btn-enviar:active { background-color: #b00220; }
      .btn-enviar:disabled { background-color: #999; cursor: not-allowed; box-shadow: none; }
      
      #mensaje { margin-top: 18px; font-weight: bold; font-size: 15px; text-align: center; }
      .exito { color: #1b9e09; }
      .error { color: #dc3545; }
      .procesando { color: #b87a00; }
    </style>
  </head>
  <body>

    <!-- Banner Superior -->
    <div class="banner">
      <span>TOP</span> NEUMÁTICOS
    </div>

    <div class="card">
      <h2>📦 Control de Remitos</h2>
      <p>Gestión de estados para logística interna</p>
      
      <form id="formRemito">
        <label>1. Número de Remito:</label>
        <div class="input-container">
          <span class="prefix">DePos/OUT/</span>
          <input type="number" id="remito_num" name="remito_num" placeholder="Ej: 06997" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required>
        </div>
        
        <label>2. Usuario:</label>
        <select id="usuario" name="usuario" required>
          <option value="" disabled selected>Seleccioná tu nombre</option>
          <option value="Hermes Diego">Hermes Diego</option>
          <option value="Alexander Ayala">Alexander Ayala</option>
          <option value="Vera Matias">Vera Matias</option>
          <option value="Alexis Silva">Alexis Silva</option>
          <option value="Jorge Lub">Jorge Lub</option>
          <option value="Sanabria Julio">Sanabria Julio</option>
          <option value="Alejandro Garcia">Alejandro Garcia</option>
          <option value="Talavera Lucas">Talavera Lucas</option>
        </select>

        <label>3. Seleccionar Estado:</label>
        <select id="subestado_id" name="subestado_id" onchange="evaluarEstado()">
          <option value="2">🚚 En viaje hacia cliente</option>
          <option value="3">✅ Entrega Final</option>
        </select>
        
        <!-- Sección dinámica para la foto -->
        <div id="seccion_foto" class="foto-section">
          <label style="margin-top:0; color: #856404;">📸 Adjuntar Remito Firmado (Obligatorio):</label>
          <input type="file" id="foto_remito" name="foto" accept="image/*" capture="environment">
        </div>
        
        <button type="button" class="btn-enviar" id="btnEnviar" onclick="validarYEnviar()">🚀 ACTUALIZAR ESTADO</button>
      </form>
      
      <div id="mensaje"></div>
    </div>

    <script>
      var urlAppsScript = "https://script.google.com/macros/s/AKfycbyCeYtSs7_5F5uT73hQIvd0-u9LNQ7_-U_o5BSJEkTfX_d5MWmsv5UqeugZULkV7AtdUA/exec";

      function evaluarEstado() {
        var estado = document.getElementById('subestado_id').value;
        var seccionFoto = document.getElementById('seccion_foto');
        if (estado === "3") {
          seccionFoto.style.display = "block";
        } else {
          seccionFoto.style.display = "none";
          document.getElementById('foto_remito').value = "";
        }
      }

      // Convierte un File a base64 puro (sin el prefijo data:...;base64,)
      function archivoABase64(archivo) {
        return new Promise(function(resolve, reject) {
          var lector = new FileReader();
          lector.onload = function() {
            var resultado = lector.result;
            var base64 = resultado.split(',')[1]; // quitamos "data:image/jpeg;base64,"
            resolve(base64);
          };
          lector.onerror = function(error) { reject(error); };
          lector.readAsDataURL(archivo);
        });
      }

      function validarYEnviar() {
        var numInput = document.getElementById('remito_num').value.trim();
        var usuario = document.getElementById('usuario').value;
        var estadoId = document.getElementById('subestado_id').value;
        var archivoFoto = document.getElementById('foto_remito').files[0];
        var btn = document.getElementById('btnEnviar');
        
        if(!numInput) {
          mostrarMensaje('⚠️ Por favor, ingresá el número de remito.', 'error');
          return;
        }

        if(!usuario) {
          mostrarMensaje('⚠️ Por favor, seleccioná el usuario.', 'error');
          return;
        }
        
        var numFormateado = numInput.padStart(5, '0');
        var remitoCompleto = "DePos/OUT/" + numFormateado;
        
        if (estadoId === "3" && !archivoFoto) {
          mostrarMensaje('❌ Debes sacar o adjuntar la foto del remito firmado.', 'error');
          return;
        }

        btn.disabled = true;
        mostrarMensaje('Procesando y subiendo a Drive... ⏳', 'procesando');

        var enviarPayload = function(fotoBase64, fotoNombre) {
          var payload = {
            remito_id: remitoCompleto,
            subestado_id: estadoId,
            usuario: usuario,
            fotoBase64: fotoBase64 || "",
            fotoNombre: fotoNombre || ""
          };

          // mode: "no-cors" -> Apps Script no devuelve headers CORS legibles,
          // así que no podemos leer la respuesta, pero la request SÍ llega
          // y el backend SÍ ejecuta (sube a Drive + avisa a n8n).
          fetch(urlAppsScript, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          })
          .then(function() {
            // No podemos confirmar el resultado real por el bloqueo de CORS,
            // así que asumimos éxito. Si falla algo del lado del servidor,
            // revisar Executions en Apps Script.
            btn.disabled = false;
            mostrarMensaje('¡Datos enviados! Verificá en Odoo. ✅', 'exito');
            document.getElementById('formRemito').reset();
            evaluarEstado();
          })
          .catch(function(error) {
            btn.disabled = false;
            console.error(error);
            mostrarMensaje('❌ Error al conectar con Apps Script.', 'error');
          });
        };

        if (archivoFoto) {
          archivoABase64(archivoFoto)
            .then(function(base64) {
              enviarPayload(base64, numFormateado + ".jpg");
            })
            .catch(function() {
              btn.disabled = false;
              mostrarMensaje('❌ Error al leer el archivo.', 'error');
            });
        } else {
          enviarPayload(null, null);
        }
      }

      function mostrarMensaje(texto, clase) {
        var msgDiv = document.getElementById('mensaje');
        msgDiv.innerText = texto;
        msgDiv.className = clase;
      }
    </script>
  </body>
</html>
